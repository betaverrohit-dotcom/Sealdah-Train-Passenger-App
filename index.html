<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sealdah Train Passenger App</title>

    <meta name="theme-color" content="#1963a6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
        }

        body {
            background: #f2f4f5;
            color: #333;
        }

        .header {
            background: #1963a6;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 500;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-icon {
            cursor: pointer;
            font-size: 1.5rem;
        }

        .tabs {
            background: #1963a6;
            display: flex;
            justify-content: space-around;
            padding: 0 10px 10px;
            color: white;
            font-weight: 500;
            font-size: .95rem;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            opacity: .8;
        }

        .tab.active {
            background: white;
            color: #1963a6;
            opacity: 1;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-card {
            background: white;
            border-radius: 8px;
            padding: 10px 15px 15px;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
            position: relative;
            margin-bottom: 15px;
        }

        .input-row {
            display: flex;
            align-items: center;
            position: relative;
            border-bottom: 1px solid #e0e0e0;
        }

        .input-row:last-of-type {
            border-bottom: none;
            margin-bottom: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 18px 10px 18px 40px;
            border: none;
            font-size: 1rem;
            outline: none;
            background: transparent;
            color: #333;
        }

        .input-row input:disabled {
            opacity: .6;
        }

        .input-icon {
            position: absolute;
            left: 5px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swap-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            color: #1e8738;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
        }

        .autocomplete-items {
            position: absolute;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,.2);
            border-radius: 0 0 8px 8px;
            display: none;
        }

        .autocomplete-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            font-size: .95rem;
        }

        .autocomplete-item:hover {
            background: #f9f9f9;
        }

        .station-code-badge {
            background: #1963a6;
            color: white;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: .8rem;
            font-weight: bold;
            margin-right: 12px;
            min-width: 50px;
            text-align: center;
        }

        .btn-find {
            width: 100%;
            background: #1e8738;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }

        .btn-find:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .extra-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
            font-size: 1rem;
            color: #333;
            border: 1px solid #f0f0f0;
        }

        #screen-search {
            display: block;
        }

        #screen-trains,
        #screen-map {
            display: none;
        }

        .train-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
            cursor: pointer;
            border-left: 5px solid #1e8738;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-card:hover {
            background: #f5f9f6;
        }

        .train-details h4 {
            color: #1963a6;
            margin-bottom: 5px;
            font-size: 1.1rem;
        }

        .train-details p {
            font-size: .9rem;
            color: #666;
        }

        .view-map-icon {
            color: #1e8738;
            font-size: 1.5rem;
        }

        #map-container {
            height: calc(100vh - 140px);
            width: 100%;
            border-radius: 8px;
            z-index: 1;
        }

        .map-status-bar {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .loading-box {
            background: white;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            color: #1963a6;
            margin-bottom: 15px;
            box-shadow: 0 1px 3px rgba(0,0,0,.1);
        }

        .status-text {
            font-size: .85rem;
            text-align: center;
            margin: 8px 0 12px;
            color: #666;
        }

        .error-box {
            background: #fff0f0;
            border: 1px solid #ffcaca;
            color: #b00020;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: .9rem;
            display: none;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header" id="app-header">
    <div class="header-left">
        <span class="header-icon">☰</span>
        <span>Sealdah Train Service</span>
    </div>
    <span class="header-icon">🎤</span>
</div>

<div class="container">

    <!-- SEARCH SCREEN -->
    <div id="screen-search">

        <div class="tabs"
             style="margin:-15px -15px 15px -15px;
                    padding-top:10px;
                    border-radius:0 0 15px 15px;">

            <div class="tab">Express</div>
            <div class="tab">Metro</div>
            <div class="tab active">Locals</div>

        </div>

        <div id="loading-box" class="loading-box">
            🚆 Loading station database...
        </div>

        <div id="error-box" class="error-box"></div>

        <div class="search-card">

            <div class="input-row">

                <span class="input-icon">◎</span>

                <input
                    type="text"
                    id="from-station"
                    placeholder="From Station"
                    autocomplete="off"
                    disabled
                >

                <div id="from-autocomplete-list"
                     class="autocomplete-items"></div>

            </div>

            <div class="swap-btn" onclick="swapStations()">
                ⇅
            </div>

            <div class="input-row">

                <span class="input-icon" style="color:#1963a6;">
                    ◉
                </span>

                <input
                    type="text"
                    id="to-station"
                    placeholder="To Station"
                    autocomplete="off"
                    disabled
                >

                <div id="to-autocomplete-list"
                     class="autocomplete-items"></div>

            </div>

            <button
                id="find-button"
                class="btn-find"
                onclick="findTrains()"
                disabled
            >
                Find trains
            </button>

        </div>

        <div class="extra-card">

            <span style="
                color:#1963a6;
                font-weight:bold;
                font-size:1.2rem;
                margin-right:10px;">
                ((•))
            </span>

            <span style="flex:1;">
                Station departure board
            </span>

            <span style="
                color:#1e8738;
                font-size:1.2rem;">
                🔍
            </span>

        </div>

        <div class="extra-card"
             style="background:#eef5ff;border:none;">

            <div>
                <strong>Explore Sealdah Railway</strong>
                <br>
                <small style="color:#555;">
                    Eastern Railway Passenger Service
                </small>
            </div>

            <div style="font-size:2rem;">
                🗺️
            </div>

        </div>

    </div>


    <!-- TRAIN SCREEN -->
    <div id="screen-trains">

        <div
            style="
                background:white;
                padding:15px;
                border-radius:8px;
                margin-bottom:15px;
                font-weight:bold;
                color:#333;
                text-align:center;
                box-shadow:0 1px 3px rgba(0,0,0,.1);
            "
            id="route-title">

            Route Details

        </div>

        <div id="train-results"></div>

    </div>


    <!-- MAP SCREEN -->
    <div id="screen-map">

        <div class="map-status-bar">

            <div
                id="map-train-title"
                style="color:#1963a6;font-weight:bold;">
                Train Live Map
            </div>

            <div style="color:#1e8738;">
                🟢 On Time
            </div>

        </div>

        <div id="map-container"></div>

    </div>

</div>


<!-- LEAFLET -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
    "https://wtvrbfqezpmxutnwjdsp.supabase.co";


/*
   IMPORTANT:
   এখানে তোমার Supabase Publishable Key বসাও।
*/

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_oFOo4DYfj1DU-tr_3n6kjA_ChfRYrqG";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   GLOBAL DATABASE
   ========================================================= */

let stationDatabase = [];


/* =========================================================
   REAL COORDINATES FOR MAJOR STATIONS
   ========================================================= */

const realCoords = {

    SDAH: [22.567, 88.371],

    BNXR: [22.583, 88.390],

    DDJ: [22.622, 88.393],

    NH: [22.894, 88.419],

    RHA: [23.176, 88.528],

    STB: [23.245, 88.434],

    KNJ: [23.401, 88.503],

    BNJ: [23.045, 88.825],

    BRP: [22.361, 88.432],

    DH: [22.189, 88.192]

};


/* =========================================================
   LOAD STATIONS FROM SUPABASE
   ========================================================= */

async function loadStations() {

    const loadingBox =
        document.getElementById("loading-box");

    const errorBox =
        document.getElementById("error-box");

    try {

        loadingBox.style.display = "block";

        errorBox.style.display = "none";

        const {
            data,
            error
        } = await supabaseClient

            .from("stations")

            .select(
                "station_code, station_name, line, zone, active"
            )

            .eq("active", true)

            .order("station_name");


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            throw new Error(
                "No active stations found in Supabase."
            );

        }


        stationDatabase = data.map((station, index) => {

            let lat =
                22.567 +
                (Math.random() - 0.5) * 1.5;

            let lng =
                88.371 +
                (Math.random() - 0.5) * 1.5;


            if (realCoords[station.station_code]) {

                lat =
                    realCoords[station.station_code][0];

                lng =
                    realCoords[station.station_code][1];

            }


            return {

                name: station.station_name,

                code: station.station_code,

                line: station.line || "",

                zone: station.zone || "Eastern Railway",

                active: station.active,

                lat: lat,

                lng: lng

            };

        });


        loadingBox.innerHTML =
            "✅ " +
            stationDatabase.length +
            " stations loaded successfully";


        loadingBox.style.color = "#1e8738";


        document.getElementById(
            "from-station"
        ).disabled = false;


        document.getElementById(
            "to-station"
        ).disabled = false;


        document.getElementById(
            "find-button"
        ).disabled = false;


        setupAutocomplete(
            document.getElementById("from-station"),
            document.getElementById("from-autocomplete-list")
        );


        setupAutocomplete(
            document.getElementById("to-station"),
            document.getElementById("to-autocomplete-list")
        );


        console.log(
            "Supabase stations loaded:",
            stationDatabase.length
        );


    } catch (error) {

        console.error(
            "Supabase station loading error:",
            error
        );


        loadingBox.style.display = "none";


        errorBox.style.display = "block";


        errorBox.innerHTML = `
            <strong>⚠️ Station database loading failed</strong>
            <br><br>
            ${escapeHtml(error.message || "Unknown error")}
            <br><br>
            Please check Supabase API / RLS settings.
        `;

    }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   AUTOCOMPLETE
   ========================================================= */

function setupAutocomplete(
    inputElement,
    listElement
) {

    inputElement.addEventListener(
        "input",
        function() {

            const val =
                this.value.trim().toLowerCase();


            listElement.innerHTML = "";


            if (!val) {

                listElement.style.display =
                    "none";

                return;

            }


            const matches =
                stationDatabase

                    .filter(st =>

                        st.name
                            .toLowerCase()
                            .includes(val)

                        ||

                        st.code
                            .toLowerCase()
                            .includes(val)

                    )

                    .slice(0, 20);


            listElement.style.display =
                "block";


            if (matches.length === 0) {

                listElement.innerHTML = `
                    <div class="autocomplete-item"
                         style="color:red;">
                        No station found
                    </div>
                `;

                return;

            }


            matches.forEach(match => {

                const div =
                    document.createElement("div");


                div.className =
                    "autocomplete-item";


                div.innerHTML = `

                    <span class="station-code-badge">
                        ${escapeHtml(match.code)}
                    </span>

                    <span>
                        ${escapeHtml(match.name)}
                    </span>

                `;


                div.addEventListener(
                    "click",
                    function() {

                        inputElement.value =
                            match.name;

                        inputElement.dataset.code =
                            match.code;

                        listElement.style.display =
                            "none";

                    }
                );


                listElement.appendChild(div);

            });

        }
    );


    document.addEventListener(
        "click",
        function(e) {

            if (
                e.target !== inputElement &&
                !listElement.contains(e.target)
            ) {

                listElement.style.display =
                    "none";

            }

        }
    );

}


/* =========================================================
   SWAP STATIONS
   ========================================================= */

function swapStations() {

    const fromInput =
        document.getElementById(
            "from-station"
        );

    const toInput =
        document.getElementById(
            "to-station"
        );


    const temp =
        fromInput.value;


    fromInput.value =
        toInput.value;


    toInput.value =
        temp;


    const tempCode =
        fromInput.dataset.code;


    fromInput.dataset.code =
        toInput.dataset.code;


    toInput.dataset.code =
        tempCode;

}


/* =========================================================
   FIND TRAINS
   ========================================================= */

function findTrains() {

    const fromInput =
        document.getElementById(
            "from-station"
        ).value.trim();


    const toInput =
        document.getElementById(
            "to-station"
        ).value.trim();


    if (!fromInput || !toInput) {

        alert(
            "Please select both From and To stations."
        );

        return;

    }


    const fromStation =
        stationDatabase.find(
            s => s.name === fromInput
        );


    const toStation =
        stationDatabase.find(
            s => s.name === toInput
        );


    if (!fromStation || !toStation) {

        alert(
            "Please select stations from the suggestion list."
        );

        return;

    }


    document.getElementById(
        "app-header"
    ).innerHTML = `

        <button
            class="back-btn"
            onclick="goHome()">

            ← &nbsp; Back

        </button>

    `;


    document.getElementById(
        "screen-search"
    ).style.display = "none";


    document.getElementById(
        "screen-trains"
    ).style.display = "block";


    document.getElementById(
        "route-title"
    ).innerText =
        `${fromStation.name} ➔ ${toStation.name}`;


    const resultsDiv =
        document.getElementById(
            "train-results"
        );


    resultsDiv.innerHTML = "";


    /*
       NOTE:
       এখানে এখনো actual train timetable নেই।
       তাই demo train cards দেখানো হচ্ছে।
       Station data কিন্তু Supabase থেকে এসেছে।
    */

    const trains = [

        {
            number: "31311",
            name: `${fromStation.name} Local`,
            departure: "06:15 AM",
            arrival: "07:05 AM"
        },

        {
            number: "31315",
            name: `${fromStation.name} Local`,
            departure: "07:10 AM",
            arrival: "08:00 AM"
        },

        {
            number: "31321",
            name: `${fromStation.name} Local`,
            departure: "08:20 AM",
            arrival: "09:10 AM"
        },

        {
            number: "31327",
            name: `${fromStation.name} Local`,
            departure: "09:30 AM",
            arrival: "10:20 AM"
        }

    ];


    trains.forEach(train => {

        const card =
            document.createElement("div");


        card.className =
            "train-card";


        card.innerHTML = `

            <div class="train-details">

                <h4>
                    ${train.number}
                    -
                    ${escapeHtml(train.name)}
                </h4>

                <p>
                    Departs:
                    <b>${train.departure}</b>
                    |
                    Arrives:
                    <b>${train.arrival}</b>
                </p>

                <p
                    style="
                        margin-top:5px;
                        color:#1e8738;
                    "
                >
                    Run Days: Daily
                </p>

            </div>

            <div class="view-map-icon">
                📍
            </div>

        `;


        card.onclick =
            () =>
                openMap(
                    fromStation.name,
                    toStation.name,
                    train.number
                );


        resultsDiv.appendChild(card);

    });

}


/* =========================================================
   GO HOME
   ========================================================= */

function goHome() {

    document.getElementById(
        "screen-search"
    ).style.display = "block";


    document.getElementById(
        "screen-trains"
    ).style.display = "none";


    document.getElementById(
        "screen-map"
    ).style.display = "none";


    document.getElementById(
        "app-header"
    ).innerHTML = `

        <div class="header-left">

            <span class="header-icon">
                ☰
            </span>

            <span>
                Sealdah Train Service
            </span>

        </div>

        <span class="header-icon">
            🎤
        </span>

    `;

}


/* =========================================================
   BACK TO TRAIN LIST
   ========================================================= */

function goBackToTrains() {

    document.getElementById(
        "screen-search"
    ).style.display = "none";


    document.getElementById(
        "screen-trains"
    ).style.display = "block";


    document.getElementById(
        "screen-map"
    ).style.display = "none";


    document.getElementById(
        "app-header"
    ).innerHTML = `

        <button
            class="back-btn"
            onclick="goHome()">

            ← &nbsp; Train List

        </button>

    `;

}


/* =========================================================
   MAP
   ========================================================= */

let leafletMap = null;

let trainMarker = null;

let routeLine = null;


function openMap(
    fromName,
    toName,
    trainNumber
) {

    document.getElementById(
        "screen-trains"
    ).style.display = "none";


    document.getElementById(
        "screen-map"
    ).style.display = "block";


    document.getElementById(
        "app-header"
    ).innerHTML = `

        <button
            class="back-btn"
            onclick="goBackToTrains()">

            ← &nbsp; Train List

        </button>

    `;


    document.getElementById(
        "map-train-title"
    ).innerText =
        `🚆 ${trainNumber} Live Map`;


    if (!leafletMap) {

        leafletMap =
            L.map("map-container")
             .setView(
                 [22.567, 88.371],
                 9
             );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    "© OpenStreetMap"
            }
        ).addTo(leafletMap);

    }


    setTimeout(
        () => {
            leafletMap.invalidateSize();
        },
        200
    );


    const fromSt =
        stationDatabase.find(
            s => s.name === fromName
        ) || stationDatabase[0];


    const toSt =
        stationDatabase.find(
            s => s.name === toName
        ) || stationDatabase[0];


    if (routeLine) {

        leafletMap.removeLayer(
            routeLine
        );

    }


    if (trainMarker) {

        leafletMap.removeLayer(
            trainMarker
        );

    }


    routeLine =
        L.polyline(

            [
                [fromSt.lat, fromSt.lng],

                [toSt.lat, toSt.lng]
            ],

            {
                color: "#1963a6",
                weight: 4
            }

        ).addTo(leafletMap);


    leafletMap.fitBounds(
        routeLine.getBounds(),
        {
            padding: [30, 30]
        }
    );


    const trainIcon =
        L.icon({

            iconUrl:
                "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",

            shadowUrl:
                "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",

            iconSize: [25, 41],

            iconAnchor: [12, 41],

            popupAnchor: [1, -34]

        });


    const midLat =
        (fromSt.lat + toSt.lat) / 2;


    const midLng =
        (fromSt.lng + toSt.lng) / 2;


    trainMarker =
        L.marker(
            [midLat, midLng],
            {
                icon: trainIcon
            }
        )
        .addTo(leafletMap);


    trainMarker.bindPopup(`

        <b>🚆 ${escapeHtml(trainNumber)}</b>

        <br><br>

        Live Train Location

        <br>

        Between
        ${escapeHtml(fromSt.code)}
        →
        ${escapeHtml(toSt.code)}

    `).openPopup();

}


/* =========================================================
   START APPLICATION
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadStations();

    }
);


/* =========================================================
   PWA SERVICE WORKER
   ========================================================= */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register("/sw.js")
                .catch(
                    error =>
                        console.log(
                            "Service Worker:",
                            error
                        )
                );

        }
    );

}

</script>
